<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <link rel="stylesheet" href="meghivo.css" />
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
</head>
</head>
<body>

  <div id="carousel">
    <div class="slide">
      <div class="image-container">
        <img src="1. page.jpg" alt="1. oldal" class="slide-image" />
      </div>
      <div class="nav-buttons">
        <button class="prev">Previous</button>
        <button class="next">Next</button>
      </div>
    </div>
    <div class="slide hidden">
      <div class="image-container">
        <img src="2. page.jpg" alt="2. page" class="slide-image" />
      </div>
      <div class="nav-buttons">
        <button class="prev">Previous</button>
        <button class="next">Next</button>
      </div>
    </div>
    <div class="slide hidden">
      <div class="image-container">
        <img src="3. page.jpg" alt="3. page" class="slide-image landscape" />
      </div>
      <div class="nav-buttons">
        <button class="prev">Previous</button>
        <button class="next">Next</button>
      </div>
    </div>
    <div class="slide hidden">
      <div class="image-container">
        <img src="4. page.jpg" alt="4. page" class="slide-image landscape" />
      </div>
      <div class="text">
        <p >RSVP and additional information on the wedding's page</p>
      </div>
      <div class="nav-buttons">
        <button class="prev">Previous</button>
        <button class="next" onclick="location.href='https://planning.wedding/website/elizabeth-and-adam';">Next to the wedding's page</button>
      </div>
    </div>
  </div>

  <script src="meghivo.js"></script>
</body>
</html>
